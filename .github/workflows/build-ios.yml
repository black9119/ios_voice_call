name: Build iOS IPA
on: push
jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter 3.32.0（最后支持iOS12的稳定版）
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.0'
          channel: stable
          architecture: x64

      - name: Flutter clean
        run: flutter clean

      - name: Pub get
        run: flutter pub get

      - name: Pod 清理+安装
        run: |
          cd ios
          rm -rf Pods Podfile.lock
          pod install

      - name: Build IPA ad-hoc
        run: flutter build ipa --export-method ad-hoc

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          path: build/ios/ipa/*.ipa
