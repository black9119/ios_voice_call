name: Build iOS IPA
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Set up job
        uses: actions/checkout@v4

      - name: Setup Flutter 3.32.0（最后支持iOS12的稳定版）
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.0'
          cache: true

      - name: Flutter clean
        run: flutter clean

      - name: Pub get
        run: flutter pub get

      - name: Pod清理+安装
        run: |
          cd ios
          pod deintegrate || true
          pod install

      - name: Build IPA ad-hoc (不签名)
        run: |
          flutter build ios --release --no-codesign
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/Runner.app
          zip -r Runner.ipa Payload
          mv Runner.ipa ../
        working-directory: ./

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios_ipa
          path: build/ios/Runner.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Post Setup Flutter 3.32.0（最后支持iOS12的稳定版）
        run: echo "done"

      - name: Post Run actions/checkout@v4
        run: echo "done"
